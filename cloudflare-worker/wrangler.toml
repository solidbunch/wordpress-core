name = "wordpress-core-release-watch"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = ["*/15 * * * *"]

# Kept in the file on purpose: a deploy without it turns Issues off even if they were enabled in
# the dashboard. Issues needs Wrangler 4.134.0 or later.
[observability]
enabled = true

[observability.issues]
enabled = true

[vars]
GITHUB_REPOSITORY = "solidbunch/wordpress-core"
GITHUB_REF = "main"
WORKFLOW_FILE = "update-packages.yml"
