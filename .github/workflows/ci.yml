name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests and packages.json check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # check() calls `git show HEAD:./packages.json`, which needs at least the current
          # commit's blob; HEAD is present even with the default shallow checkout, so depth 2
          # is a cheap safety margin rather than a strict requirement.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --test
      - run: node generate-packages-json.js --check

      # status.json/badges are a deterministic projection of packages.json, so a drift here means
      # the committed artifacts were not regenerated - fail loudly rather than serve stale badges.
      - name: Check the status artifacts are in sync
        run: |
          node generate-packages-json.js --status
          git diff --exit-code status.json badges
