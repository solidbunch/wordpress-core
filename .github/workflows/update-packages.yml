name: WordPress release watch

on:
  schedule:
    - cron: "3-59/10 * * * *" # light release check, off the hour because scheduled runs are delayed at :00
    - cron: "7 4 * * *"
  workflow_dispatch:     # allows manual triggering of the workflow, always a full generator run

jobs:
  check:
    name: Check wordpress.org for new releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check for a new WordPress release
        id: gate
        env:
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '7 4 * * *' }}
        run: node check-new-versions.js

  update:
    name: Update packages.json
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: wp-core-repo-write
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate packages.json
        id: generate
        run: node generate-packages-json.js

      - name: Commit and Push if Changed
        env:
          COMMIT_VERSION: ${{ steps.generate.outputs.commit_version }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if [ -n "$COMMIT_VERSION" ]; then
            COMMIT_MESSAGE="🔄 Update WordPress core to $COMMIT_VERSION"
          else
            COMMIT_MESSAGE="🔄 Update WordPress core metadata"
          fi
          git add packages.json
          git diff --cached --quiet || git commit -m "$COMMIT_MESSAGE"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push

      - name: Fail if the run was incomplete
        if: ${{ (steps.generate.outputs.incomplete || '0') != '0' }}
        env:
          INCOMPLETE: ${{ steps.generate.outputs.incomplete }}
        run: |
          echo "::error::$INCOMPLETE version(s) deferred; see the generator log"
          exit 1
