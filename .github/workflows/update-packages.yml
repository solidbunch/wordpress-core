name: Update WordPress Core Package

on:
  schedule:
    - cron: "0 3 * * 1,3,5" # Monday, Wednesday, Friday at 03:00 UTC
  workflow_dispatch:     # allows manual triggering of the workflow

permissions:
  contents: write

concurrency:
  group: update-wordpress-core
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate packages.json
        id: generate
        run: node generate-packages-json.js

      - name: Commit and Push if Changed
        env:
          COMMIT_VERSION: ${{ steps.generate.outputs.commit_version }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if [ -n "$COMMIT_VERSION" ]; then
            COMMIT_MESSAGE="🔄 Update WordPress core to $COMMIT_VERSION"
          else
            COMMIT_MESSAGE="🔄 Update WordPress core metadata"
          fi
          git add packages.json
          git diff --cached --quiet || git commit -m "$COMMIT_MESSAGE"
          git push

      - name: Fail if the run was incomplete
        if: ${{ (steps.generate.outputs.incomplete || '0') != '0' }}
        env:
          INCOMPLETE: ${{ steps.generate.outputs.incomplete }}
        run: |
          echo "::error::$INCOMPLETE version(s) deferred; see the generator log"
          exit 1
