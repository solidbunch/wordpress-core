name: WordPress release watch

on:
  schedule:
    - cron: "7 4 * * *" # daily full run; also the fallback if the Cloudflare cron in cloudflare-worker/ stops
  workflow_dispatch:     # manual or external trigger; a full generator run unless mode is "light"
    inputs:
      mode:
        description: "light = release check only (used by the Cloudflare cron), full = always run the generator"
        type: choice
        options:
          - full
          - light
        default: full

jobs:
  check:
    name: Check wordpress.org for new releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check for a new WordPress release
        id: gate
        env:
          FORCE_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode != 'light') || github.event.schedule == '7 4 * * *' }}
        run: node check-new-versions.js

  update:
    name: Update packages.json
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      id-token: write
      attestations: write
    concurrency:
      group: wp-core-repo-write
      cancel-in-progress: false

    outputs:
      has_token: ${{ steps.token.outputs.present }}
      pushed: ${{ steps.push.outputs.pushed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Job-level `if:` cannot read `secrets.*` directly, so whether PUBLISH_TOKEN is configured is
      # exposed as a job output here for the `publish` job's `if:` to consume.
      - name: Detect the publishing token
        id: token
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -n "$PUBLISH_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Generate packages.json
        id: generate
        run: node generate-packages-json.js

      - name: Commit and Push if Changed
        id: push
        env:
          COMMIT_VERSION: ${{ steps.generate.outputs.commit_version }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if [ -n "$COMMIT_VERSION" ]; then
            COMMIT_MESSAGE="🔄 Update WordPress core to $COMMIT_VERSION"
          else
            COMMIT_MESSAGE="🔄 Update WordPress core metadata"
          fi
          git add packages.json status.json badges
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "$COMMIT_MESSAGE"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push || exit 1
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Committed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Attest packages.json
        if: ${{ steps.push.outputs.pushed == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages.json

      - name: Fail if the run was incomplete
        if: ${{ (steps.generate.outputs.incomplete || '0') != '0' }}
        env:
          INCOMPLETE: ${{ steps.generate.outputs.incomplete }}
        run: |
          echo "::error::$INCOMPLETE version(s) deferred; see the generator log"
          exit 1

      # if: failure() also fires for the deliberate "incomplete run" failure above -
      # that is intended: a deferred version should be visible.
      - name: Open or comment an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "WordPress release watch failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          body="The update job failed. Run: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  publish:
    name: Publish tags for Packagist
    needs: update
    if: ${{ needs.update.outputs.has_token == 'true' && needs.update.outputs.pushed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # contents: read only - this job writes to OTHER repositories via PUBLISH_TOKEN, never to this
    # one. It never touches packages.json and therefore cannot affect the Pages output. It is
    # deliberately NOT in the wp-core-repo-write concurrency group for the same reason: it does not
    # write this repository, so it cannot race with the `update` job's commit/push.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Publish new version tags
        env:
          PUBLISH_REPO_WORDPRESS_CORE: ${{ vars.PUBLISH_REPO_WORDPRESS_CORE }}
          PUBLISH_REPO_WORDPRESS_CORE_NO_CONTENT: ${{ vars.PUBLISH_REPO_WORDPRESS_CORE_NO_CONTENT }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: node publish-packages.js
