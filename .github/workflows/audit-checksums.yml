name: Weekly checksum audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Re-check published checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - id: audit
        run: node audit-checksums.js

      - name: Open or comment an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Checksum audit failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          body="The weekly checksum audit failed. Run: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
