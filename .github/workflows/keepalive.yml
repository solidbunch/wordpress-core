name: Repository Keepalive

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wp-core-repo-write
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create keepalive heartbeat
        run: |
          mkdir -p .github/keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive/last-activity.txt

      - name: Commit and push heartbeat
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .github/keepalive/last-activity.txt
          git diff --cached --quiet || git commit -m "chore: keepalive heartbeat"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push
